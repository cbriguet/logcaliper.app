<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>og-profiler</title>
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased;
  background: linear-gradient(165deg, #334F71 0%, #22374e 55%, #16242f 100%); color: #fff; position: relative; }
.brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 650; letter-spacing: -.02em; color: #c3d3e2; }
.brand img { width: 56px; height: 56px; border-radius: 13px; }
h1 { position: absolute; left: 72px; top: 170px; width: 520px; font-size: 60px; line-height: 1.08; font-weight: 650; letter-spacing: -.025em; }
.sub { position: absolute; left: 72px; top: 330px; width: 480px; font-size: 25px; line-height: 1.4; color: #c3d3e2; }
.foot { position: absolute; left: 72px; bottom: 64px; width: 480px; font-size: 22px; color: #9fb6cb; }
.frame { position: absolute; left: 620px; top: 64px; width: 508px; border-radius: 12px; overflow: hidden; background: #10181f;
  box-shadow: 0 30px 60px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.14); }
.bar { height: 30px; display: flex; align-items: center; justify-content: center; background: #16222c; border-bottom: 1px solid #2a3a48;
  font: 500 13px/1 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; color: #9aa9b8; }
.view { height: 600px; overflow: hidden; }
.view img { width: 508px; display: block; }
</style></head>
<body>
  <div class="brand"><img src="../brand/logo-512.png" alt="">Logcaliper</div>
  <h1>Profile a log file in your browser.</h1>
  <p class="sub">Bytes per event, message templates, events per second and a year of storage.</p>
  <p class="foot">Nothing is uploaded · logcaliper.app/profiler</p>
  <div class="frame"><div class="bar">logcaliper.app/profiler/</div><div class="view"><img src="../profiler/hero-dark.webp" alt=""></div></div>
</body></html>
